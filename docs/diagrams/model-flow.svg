<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Xóm E-Com: DuckDB model layers and grain</title>
<desc id="desc">Planned model flow from PostgreSQL snapshots into DuckDB. Four Bronze snapshot tables feed four typed staging views. Enriched order lines retain row_id, then aggregate to validated order_key. First analytics marts are monthly performance, product performance and customer RFM. Category discount can use SQL analyses; market basket is deferred until product identity and sufficient basket support are confirmed. Candidate keys, currencies and metric definitions still require profiling.</desc>
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11Z" fill="#6ddcc4"/></marker>
 <style>
 text{font-family:'Segoe UI',Arial,sans-serif}
 .eyebrow{font-size:15px;font-weight:700;letter-spacing:1.6px;fill:#9bb3ce}
 .title{font-size:42px;font-weight:700;fill:#f2f6ff}
 .subtitle{font-size:21px;fill:#b3c3d9}
 .heading{font-size:25px;font-weight:700;fill:#eef5ff}
 .name{font-size:22px;font-weight:600;fill:#eef5ff}
 .body{font-size:20px;fill:#c9d6e7}
 .small{font-size:17px;fill:#a3b9d3}
 .edge{fill:none;stroke:#6ddcc4;stroke-width:3;marker-end:url(#arrow)}
 </style>
</defs>
<rect width="1600" height="1000" rx="28" fill="#0d1422"/>
<text x="62" y="48" class="eyebrow">XÓM E-COM / DUCKDB MODEL BLUEPRINT</text>
<text x="62" y="108" class="title">Model the grain before the metric.</text>
<text x="62" y="148" class="subtitle">PostgreSQL source → DuckDB Bronze → dbt Silver / Gold · full snapshot and rebuild first</text>
<rect x="62" y="220" width="330" height="322" rx="20" fill="#1b302e" stroke="#5a998a" stroke-width="2"/>
<text x="86" y="260" class="heading">Bronze · PG snapshot</text>
<text x="86" y="304" class="name">customer</text>
<text x="86" y="331" class="small">One customer_id</text>
<text x="86" y="371" class="name">product</text>
<text x="86" y="398" class="small">One product_code</text>
<text x="86" y="438" class="name">region</text>
<text x="86" y="465" class="small">One region_code</text>
<text x="86" y="505" class="name">ecom_sales · one row_id</text>
<path class="edge" d="M392 382 H452"/>
<rect x="452" y="220" width="392" height="322" rx="20" fill="#282b40" stroke="#8b7daf" stroke-width="2"/>
<text x="476" y="260" class="heading">staging · typed views</text>
<text x="476" y="308" class="name">stg_customers</text>
<text x="476" y="352" class="name">stg_products</text>
<text x="476" y="396" class="name">stg_regions</text>
<text x="476" y="440" class="name">stg_ecom_sales</text>
<text x="476" y="487" class="small">Types / null rules / keys / relationships</text>
<text x="476" y="516" class="small">No arbitrary dedup or hidden exclusions</text>
<path class="edge" d="M844 382 H876 V333 H902"/>
<rect x="902" y="220" width="636" height="322" rx="20" fill="#19283b" stroke="#708bab" stroke-width="2"/>
<text x="926" y="260" class="heading">intermediate → core facts in marts</text>
<rect x="926" y="286" width="588" height="92" rx="12" fill="#263b4d" stroke="#547d98"/>
<text x="950" y="321" class="name">fct_order_lines</text>
<text x="950" y="351" class="body">One row_id · dimension joins must not fan out</text>
<path class="edge" d="M1220 378 V420"/>
<rect x="926" y="420" width="588" height="92" rx="12" fill="#263b4d" stroke="#547d98"/>
<text x="950" y="455" class="name">fct_orders</text>
<text x="950" y="485" class="body">One validated order_key · sales / profit roll-up</text>
<path class="edge" d="M1220 542 V596 H287 V654"/>
<path class="edge" d="M1220 596 H801 V654"/>
<path class="edge" d="M1220 596 H1313 V654"/>
<text x="62" y="576" class="eyebrow">FIRST THREE ANALYTICS MARTS · RECONCILE BEFORE REPORTING</text>
<rect x="62" y="670" width="450" height="151" rx="18" fill="#353121" stroke="#b6a65d" stroke-width="2"/>
<text x="86" y="710" class="heading">Monthly performance</text>
<text x="86" y="746" class="body">Month × market × segment</text>
<text x="86" y="780" class="small">From lines · sales / margin / calendar YoY</text>
<rect x="576" y="670" width="450" height="151" rx="18" fill="#353121" stroke="#b6a65d" stroke-width="2"/>
<text x="600" y="710" class="heading">Product performance</text>
<text x="600" y="746" class="body">Product code × analysis period</text>
<text x="600" y="780" class="small">From lines · quantity / sales / profit</text>
<rect x="1088" y="670" width="450" height="151" rx="18" fill="#353121" stroke="#b6a65d" stroke-width="2"/>
<text x="1112" y="710" class="heading">Customer RFM</text>
<text x="1112" y="746" class="body">Customer × fixed as_of_date</text>
<text x="1112" y="780" class="small">From orders · explicit window and scoring</text>
<rect x="62" y="866" width="1476" height="65" rx="15" fill="#1c2334" stroke="#495a73" stroke-dasharray="6 6"/>
<text x="86" y="906" class="body">Next: discount analysis SQL · basket after product-identity and support checks · dashboard after insight validation</text>
<text x="62" y="975" class="small">Candidate keys require profiling · source-reported sales/profit semantics and currency remain open · not implemented models</text>
</svg>
