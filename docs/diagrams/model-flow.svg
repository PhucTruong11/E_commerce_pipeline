<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Xóm E-Com: grain and dbt models serving business questions</title>
  <desc id="desc">Logical model map, not a completed DAG. The four raw tables are already loaded. Four dbt Bronze views are verified, followed by planned Silver staging and enrichment preserve grain and unknown keys; planned Gold facts support profitability, discount, product mix and monthly-change questions. RFM and basket are later phases. Tests and query evidence are required before business conclusions.</desc>
