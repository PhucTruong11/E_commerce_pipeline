<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Xóm E-Com: business questions, dbt and trusted insights</title>
  <desc id="desc">Commercial analytics roadmap. Ask about profitability and loss, discount, product mix and trends; agree on metrics and grain; build dbt models and tests; use SQL evidence to propose and validate actions. The PostgreSQL-to-DuckDB raw foundation is implemented. Four dbt Bronze views are built and reconciled; dbt data tests, Silver, Gold, reporting and publication remain planned. No business findings have been published.</desc>
  <defs>
    <marker id="data-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11Z" fill="#6ddcc4"/></marker>
    <marker id="context-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11Z" fill="#b9a9f3"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; fill: #aebbd2; }
      .title { font-size: 44px; font-weight: 700; fill: #f2f6ff; }
      .subtitle { font-size: 21px; fill: #b5c5dc; }
      .tag { font-size: 15px; font-weight: 700; letter-spacing: 0.8px; }
      .heading { font-size: 27px; font-weight: 700; fill: #f1f5ff; }
      .name { font-size: 23px; font-weight: 600; fill: #eaf2ff; }
      .body { font-size: 20px; fill: #ccdaeb; }
      .small { font-size: 18px; fill: #aec1db; }
      .data-edge { fill: none; stroke: #6ddcc4; stroke-width: 3; marker-end: url(#data-arrow); }
      .context-edge { fill: none; stroke: #b9a9f3; stroke-width: 2.5; stroke-dasharray: 7 7; marker-end: url(#context-arrow); }
    </style>
  </defs>
  <rect width="1600" height="1100" rx="28" fill="#0d1422"/>
  <text x="62" y="48" class="eyebrow">XÓM E-COM / COMMERCIAL ANALYTICS + DBT · 2026-10-24</text>
  <text x="62" y="108" class="title">Business questions → trusted insights</text>
  <text x="62" y="148" class="subtitle">Understand the business · define the metrics · model the grain · validate the evidence</text>
  <rect x="62" y="198" width="465" height="112" rx="18" fill="#1c2338" stroke="#665e8a" stroke-width="1.5"/>
  <text x="86" y="226" class="tag" fill="#c6b5fa">B01 · PROFITABILITY AND LOSS</text>
  <text x="86" y="260" class="body">Where are sales and profit concentrated?</text>
  <text x="86" y="289" class="small">Which groups need closer investigation?</text>
  <rect x="568" y="198" width="465" height="112" rx="18" fill="#1c2338" stroke="#665e8a" stroke-width="1.5"/>
  <text x="592" y="226" class="tag" fill="#c6b5fa">B02 · DISCOUNT AND MARGIN</text>
  <text x="592" y="260" class="body">How does discount relate to margin?</text>
  <text x="592" y="289" class="small">Compare like-for-like groups.</text>
  <rect x="1074" y="198" width="464" height="112" rx="18" fill="#1c2338" stroke="#665e8a" stroke-width="1.5"/>
  <text x="1098" y="226" class="tag" fill="#c6b5fa">B03 / B04 · PRODUCT MIX AND TIME</text>
  <text x="1098" y="260" class="body">Which products / periods need attention?</text>
  <text x="1098" y="289" class="small">Separate scale, profitability and mix.</text>
  <path d="M800 310 V370" class="context-edge"/>
  <rect x="62" y="370" width="440" height="144" rx="18" fill="#18312d" stroke="#538d7e" stroke-width="1.5"/>
  <text x="86" y="398" class="tag" fill="#7fe1c5">IMPLEMENTED · DATA FOUNDATION</text>
  <text x="86" y="434" class="heading">CSV → PostgreSQL source</text>
  <text x="86" y="466" class="body">Validated snapshot extraction</text>
  <text x="86" y="494" class="small">Python / Docker · private project runtime</text>
  <rect x="580" y="370" width="958" height="144" rx="18" fill="#242238" stroke="#766992" stroke-width="1.5"/>
  <text x="604" y="398" class="tag" fill="#edc984">OPEN DEFINITIONS · BEFORE BUSINESS CLAIMS</text>
  <text x="604" y="434" class="heading">Agree on metrics, grain and coverage</text>
  <text x="604" y="466" class="body">Currency · sales / profit meaning · order key · product identity</text>
  <text x="604" y="494" class="small">State assumptions and limits; do not turn hypotheses into findings.</text>
  <path d="M282 514 V590" class="data-edge"/>
  <path d="M800 514 V590" class="context-edge"/>
  <rect x="62" y="590" width="440" height="196" rx="18" fill="#19332e" stroke="#538d7e" stroke-width="1.5"/>
  <text x="86" y="620" class="tag" fill="#7fe1c5">LOADED · DBT SOURCE TESTS NEXT</text>
  <text x="86" y="658" class="heading">DuckDB · raw</text>
  <text x="86" y="696" class="body">4 typed source snapshots</text>
  <text x="86" y="730" class="small">Counts / hashes / lineage reconciled</text>
  <text x="86" y="762" class="small">Source declarations + extraction metadata</text>
  <rect x="580" y="590" width="440" height="196" rx="18" fill="#28253b" stroke="#80709e" stroke-width="1.5"/>
  <text x="604" y="620" class="tag" fill="#edc984">BRONZE READY · SILVER NEXT</text>
  <text x="604" y="658" class="heading">dbt · Bronze → Silver</text>
  <text x="604" y="696" class="body">Verified views → staging + joins</text>
  <text x="604" y="730" class="small">Keep row grain / precision / unknowns</text>
  <text x="604" y="762" class="small">Next: source / model data tests</text>
  <rect x="1098" y="590" width="440" height="196" rx="18" fill="#332e21" stroke="#ac985a" stroke-width="1.5"/>
  <text x="1122" y="620" class="tag" fill="#edc984">PLANNED · DBT MODELS</text>
  <text x="1122" y="658" class="heading">dbt · Gold</text>
  <text x="1122" y="696" class="body">Line / order facts + reusable marts</text>
  <text x="1122" y="730" class="small">Profit / margin / loss / time / product</text>
  <text x="1122" y="762" class="small">Build only what the questions need</text>
  <path d="M502 688 H580" class="data-edge"/>
  <path d="M1020 688 H1098" class="context-edge"/>
  <path d="M1318 786 V850" class="context-edge"/>
  <rect x="62" y="850" width="440" height="159" rx="18" fill="#1c2839" stroke="#607d9d" stroke-width="1.5"/>
  <text x="86" y="880" class="tag" fill="#edc984">NEXT · ANALYTICAL QUALITY GATES</text>
  <text x="86" y="920" class="heading">Grain · keys · totals</text>
  <text x="86" y="954" class="body">Preserve all eligible sales rows</text>
  <text x="86" y="986" class="small">Publish unknown / null coverage</text>
  <path d="M502 930 H580" class="context-edge"/>
  <rect x="580" y="850" width="958" height="159" rx="18" fill="#1d2a3d" stroke="#6b8fb2" stroke-width="1.5"/>
  <text x="604" y="880" class="tag" fill="#c6b5fa">PLANNED · AFTER MODELS AND CHECKS</text>
  <text x="604" y="920" class="heading">SQL → evidence → proposed action</text>
  <text x="604" y="954" class="body">Metric + period + population + query + materiality + caveats</text>
  <text x="604" y="986" class="small">Validate the hypothesis before calling the action an improvement.</text>
<circle cx="68" cy="1046" r="5" fill="#7fe1c5"/>
  <text x="83" y="1052" class="small">Foundation implemented</text>
<circle cx="368" cy="1046" r="5" fill="#edc984"/>
  <text x="383" y="1052" class="small">dbt tests / Silver / Gold / analyses planned</text>
  <text x="62" y="1084" class="small">P1: profit, discount, product and trends · P2: customers / RFM / basket · Airflow, CDC and dashboard later</text>
</svg>
